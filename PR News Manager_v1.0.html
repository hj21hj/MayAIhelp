<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>재단 관련 보도 시스템</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZN77QMBX7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        document.addEventListener("DOMContentLoaded", function() {
            gtag('js', new Date());
            gtag('config', 'G-DZN77QMBX7');
        });
    </script>

    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background-color: #f4f7f9; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        
        /* 탭 디자인 */
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #eee; gap: 5px; }
        .tab-button { padding: 12px 25px; cursor: pointer; border: none; background: #f8f9fa; font-size: 1em; font-weight: bold; color: #777; border-radius: 8px 8px 0 0; transition: 0.3s; }
        .tab-button.active { background: #1e90ff; color: white; }
        .tab-content { display: none; text-align: left; }
        .tab-content.active { display: block; }

        /* PDF 섹션 스타일 (기존 유지) */
        #fileList { text-align: left; margin: 20px 0; min-height: 100px; border: 1px dashed #ccc; padding: 10px; background: #fff; }
        .file-item { margin: 5px 0; padding: 10px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .file-item.invalid { background: #ffe6e6; }
        .file-item button { background: #ff6347; color: white; border: none; cursor: pointer; padding: 5px 10px; border-radius: 3px; }
        button#mergeBtn { width: 100%; padding: 15px; background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 1.1em; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        #dropArea { border: 2px dashed #aaa; padding: 40px; margin-top: 20px; cursor: pointer; background: #fafafa; border-radius: 10px; text-align: center; }
        
        /* 게시물 생성기 스타일 */
        #inputText { width: 100%; height: 180px; padding: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; font-family: 'Malgun Gothic'; font-size: 13px; line-height: 1.6; resize: vertical; margin-bottom: 10px; }
        .editor-preview-container { border: 1px solid #ddd; border-radius: 5px; background: white; margin-top: 15px; }
        .editor-toolbar { background: #f8f9fa; padding: 10px; border-bottom: 1px solid #ddd; display: flex; gap: 10px; }
        #editorPreview { padding: 20px; overflow-x: auto; min-height: 200px; }
        #htmlOutput { width: 100%; height: 300px; font-family: 'Consolas', monospace; padding: 15px; box-sizing: border-box; display: none; background: #2d2d2d; color: #ccc; border: none; }
        .btn-action { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: #1e90ff; color: white; }
        .btn-dark { background: #444; color: white; }
        .btn-green { background: #28a745; color: white; }

        .info-box { font-size: 0.85em; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background: #fdfdfd; text-align: justify; line-height: 1.6; border-left: 5px solid #1e90ff; }
        iframe { width: 100%; height: 600px; border: 1px solid #ddd; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="location.reload()" style="cursor:pointer">재단 보도 업무 지원툴<sup style="font-size: 0.4em; color: #999; margin-left: 10px;">프린트, 게시 업무</sup></h1>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab(event, 'mergeTab')">PDF 병합 & 넘버링</button>
        <button class="tab-button" onclick="openTab(event, 'editorTab')">게시판 표(HTML) 생성</button>
    </div>

    <div id="mergeTab" class="tab-content active">
        <div class="info-box">
            ➀ 표지와 기사 목록 PDF 저장 > ➁ 기사 전문 PDF 출력 > ➂ 순서대로 드래그 하여 업로드 (3페이지부터 자동 넘버링 시작)
        </div>
        <div id="dropArea" onclick="document.getElementById('fileInput').click()">
            파일을 여기에 드래그하거나 클릭하여 선택하세요
            <input type="file" id="fileInput" multiple accept=".pdf" style="display:none" onchange="handleFiles(this.files)">
        </div>
        <div id="fileList"></div>
        <button id="mergeBtn" onclick="mergeFiles()">파일 병합 및 페이지 번호 삽입</button>
        <div id="previewContainer" style="display:none;">
            <div style="margin: 20px 0; text-align: center;">
                <a id="downloadLink" style="font-weight: bold; color: #1e90ff; text-decoration: none; border: 2px solid #1e90ff; padding: 10px 20px; border-radius: 5px;">📥 병합된 PDF 다운로드</a>
            </div>
            <iframe id="pdfPreview"></iframe>
        </div>
    </div>

    <div id="editorTab" class="tab-content">
        <div class="info-box">
            <b>텍스트 붙여넣기 가이드:</b> 언론사, 기사 제목, 비고, URL 순서로 된 텍스트를 입력창에 넣으세요. <br>
            [표 생성하기]를 누르면 재단 전용 템플릿(휴먼명조/파란링크 등)이 적용된 결과가 나옵니다.
        </div>
        
        <textarea id="inputText" placeholder="미디어오늘&#10;기사 제목 예시입니다&#10;연구 조사&#10;https://www.link.com..."></textarea>
        
        <div class="editor-preview-container">
            <div class="editor-toolbar">
                <button onclick="generateTable()" class="btn-action btn-blue">⚡ 표 생성하기</button>
                <button onclick="toggleView('edit')" class="btn-action btn-dark">미리보기</button>
                <button onclick="toggleView('html')" class="btn-action btn-dark">HTML 코드</button>
                <div style="flex-grow:1"></div>
                <button onclick="copyHTML()" class="btn-action btn-green">코드 복사</button>
            </div>
            <div id="editorPreview">
                <p style="text-align:center; color:#999; margin-top:50px;">텍스트를 입력하고 위 버튼을 클릭하세요.</p>
            </div>
            <textarea id="htmlOutput" readonly></textarea>
        </div>
    </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.0/dist/pdf-lib.min.js"></script>
<script>
    // --- 공통: 탭 로직 ---
    function openTab(evt, tabName) {
        let i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
        tablinks = document.getElementsByClassName("tab-button");
        for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // --- 탭 2: 표 생성기 로직 ---
    function generateTable() {
        const input = document.getElementById('inputText').value.trim();
        if(!input) { alert("내용을 입력해주세요."); return; }

        const lines = input.split('\n').map(l => l.trim()).filter(l => l);
        
        // 헤더 필터링 (텍스트에 '언론사', '기사 제목' 등이 포함되어 있으면 제거)
        let dataLines = lines.filter(line => !["언론사", "기사 제목", "비고"].includes(line));

        let rowsHtml = '';
        for (let i = 0; i < dataLines.length; i += 4) {
            const media = dataLines[i] || '';
            const title = dataLines[i+1] || '';
            const note = dataLines[i+2] || '';
            const url = dataLines[i+3] || '';

            rowsHtml += `
<tr style="box-sizing: border-box;">
    <td rowspan="2" style="box-sizing: border-box; margin: 0px; padding: 0px; width: 91px; height: 44px; border: 1px solid rgb(0, 0, 0); vertical-align: middle; text-align: center; background: #fff;">
        <p style="margin:0;"><span style="font-family:휴먼명조; letter-spacing:-1.5pt; font-size:11pt;">${media}</span></p>
    </td>
    <td style="box-sizing: border-box; margin: 0px; padding: 1px 10px; width: 511px; height: 22px; border-top: 1px solid rgb(0, 0, 0); vertical-align: middle; background: #fff;">
        <p style="margin:0; line-height:1.4; word-break:keep-all;"><span style="font-family:함초롬바탕; font-size:11pt;">${title}</span></p>
    </td>
    <td rowspan="2" style="box-sizing: border-box; margin: 0px; padding: 0px; width: 81px; height: 44px; border: 1px solid rgb(0, 0, 0); vertical-align: middle; text-align: center; background: #fff;">
        <p style="margin:0;"><span style="font-family:휴먼명조; letter-spacing:-1.5pt; font-size:11pt;">${note}</span></p>
    </td>
</tr>
<tr style="box-sizing: border-box;">
    <td style="box-sizing: border-box; margin: 0px; padding: 1px 10px; width: 511px; height: 22px; border-bottom: 1px solid rgb(0, 0, 0); vertical-align: middle; background: #fff;">
        <p style="margin:0;"><a href="${url}" target="_blank" style="color:blue; text-decoration:underline; font-family:'맑은 고딕'; font-size:11pt;">${url}</a></p>
    </td>
</tr>`;
        }

        const template = `
<p style="font-family:굴림;font-size:10pt">&nbsp;<span style="font-family:'맑은 고딕';font-size:11pt">재단 관련 주요보도입니다.</span></p>
<table style="font-family: Pretendard, sans-serif; border-collapse: collapse; table-layout: fixed; border: none; width: 683px; background-color: #fff;">
    <tbody>
        <tr style="background: #e5e5e5; text-align: center; font-weight: bold;">
            <td style="border: 1px solid #000; width: 91px; height: 27px; vertical-align: middle; font-family: 휴먼명조;">언론사</td>
            <td style="border: 1px solid #000; width: 511px; height: 27px; vertical-align: middle; font-family: 휴먼명조;">기사 제목</td>
            <td style="border: 1px solid #000; width: 81px; height: 27px; vertical-align: middle; font-family: 휴먼명조;">비고</td>
        </tr>
        ${rowsHtml}
    </tbody>
</table>
<p>&nbsp;</p>`;

        document.getElementById('editorPreview').innerHTML = template;
        toggleView('edit');
    }

    function toggleView(mode) {
        if(mode === 'edit') {
            document.getElementById('editorPreview').style.display = 'block';
            document.getElementById('htmlOutput').style.display = 'none';
        } else {
            document.getElementById('htmlOutput').value = document.getElementById('editorPreview').innerHTML.trim();
            document.getElementById('editorPreview').style.display = 'none';
            document.getElementById('htmlOutput').style.display = 'block';
        }
    }

    async function copyHTML() {
        toggleView('html');
        const code = document.getElementById('htmlOutput').value;
        await navigator.clipboard.writeText(code);
        alert("HTML 코드가 복사되었습니다. 게시판 HTML 모드에 붙여넣으세요.");
    }

    // --- 탭 1: PDF 병합 로직 (기존 로직 유지) ---
    async function mergeFiles() {
        const fileItems = document.querySelectorAll('.file-item:not(.invalid)');
        if (fileItems.length === 0) { alert("병합할 PDF 파일을 추가해주세요!"); return; }
        try {
            const mergedPdf = await PDFLib.PDFDocument.create();
            for (let item of fileItems) {
                const arrayBuffer = await item.file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const pages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPages().map((_, i) => i));
                pages.forEach(page => mergedPdf.addPage(page));
            }
            const pages = mergedPdf.getPages();
            for (let i = 0; i < pages.length; i++) {
                if (i < 2) continue;
                const { width } = pages[i].getSize();
                const pageText = `- ${i} -`;
                pages[i].drawText(pageText, {
                    x: width / 2 - (pageText.length * 2.5),
                    y: 20,
                    size: 10,
                    color: PDFLib.rgb(0, 0, 0),
                });
            }
            const mergedPdfBytes = await mergedPdf.save();
            const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            document.getElementById("downloadLink").href = url;
            document.getElementById("downloadLink").download = "정부광고_병합파일.pdf";
            document.getElementById("downloadLink").style.display = "inline-block";
            document.getElementById("pdfPreview").src = url;
            document.getElementById("previewContainer").style.display = "block";
        } catch (error) {
            console.error(error);
            alert("파일 병합 중 오류 발생.");
        }
    }

    const dropArea = document.getElementById("dropArea");
    dropArea.addEventListener("dragover", (e) => { e.preventDefault(); dropArea.style.background = "#e1f5fe"; });
    dropArea.addEventListener("dragleave", () => { dropArea.style.background = "#fafafa"; });
    dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.style.background = "#fafafa";
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        const fileListDiv = document.getElementById("fileList");
        for (let file of files) {
            const fileItem = document.createElement("div");
            fileItem.className = "file-item";
            fileItem.file = file;
            const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith('.pdf');
            fileItem.innerHTML = `<span>${file.name} ${isPdf ? '' : '<small style="color:red">(PDF 아님)</small>'}</span><button onclick="this.parentElement.remove()">X</button>`;
            if (!isPdf) fileItem.classList.add("invalid");
            fileListDiv.appendChild(fileItem);
        }
    }
</script>
</body>
</html>
