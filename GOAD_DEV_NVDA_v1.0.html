<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>May AI Help<sup style="font-size: 0.5em;">대체텍스트 도우미</sup></title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 960px; margin: 40px auto; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; }
    .info-box {
      background: #f0f8ff; border: 1px solid #b0c4de; padding: 15px; margin-bottom: 20px;
      font-size: 0.9em; line-height: 1.5;
    }
    textarea {
      width: 100%; height: 200px; padding: 10px; font-family: monospace; font-size: 14px; margin-top: 10px;
    }
    button {
      padding: 10px 20px; margin-top: 20px; background: #4CAF50; color: white; border: none; cursor: pointer;
    }
    button:hover { background: #45a049; }
    label { font-weight: bold; display: block; margin-top: 20px; }
    .preview-box { border: 1px dashed #ccc; padding: 10px; margin-top: 10px; min-height: 100px; background: #fafafa; }
    .highlight { background: #ffff99; font-weight: bold; }
  </style>
</head>
<body>
  <h1>May AI Help<sup style="font-size: 0.5em;">웹 접근성 지원</sup></h1>

  <div class="info-box">
    이 도구는 웹 접근성을 위한 대체 텍스트(alt text)를 자동 생성해주는 도우미입니다.<br>
    이미지가 포함된 HTML 코드를 입력하면 시각장애인을 위한 음성 출력에 적합하도록 <b>alt 및 title</b> 속성을 자동 보완해줍니다.<br>
    NVDA 등 스크린 리더 프로그램과 함께 사용할 수 있도록 개발되었습니다.<br>
  </div>

  <label for="inputHtml">📝 원본 HTML 코드</label>
  <textarea id="inputHtml" placeholder="여기에 이미지가 포함된 HTML 코드를 붙여넣으세요..."></textarea>

  <button onclick="convertHtml()">대체 텍스트 자동 변환</button>

  <label for="outputHtml">✅ 변환된 HTML (웹 접근성 적용)</label>
  <textarea id="outputHtml" readonly></textarea>

  <label for="screenReader">🔊 텍스트 읽기 (스크린 리더 시뮬레이션)</label>
  <div class="preview-box" id="screenReader" tabindex="0" aria-live="polite"></div>
  <button onclick="playAudio()">🔈 오디오로 듣기</button>

  <script>
    function convertHtml() {
      const input = document.getElementById("inputHtml").value;
      const outputArea = document.getElementById("outputHtml");
      const reader = document.getElementById("screenReader");

      const converted = input.replace(/<img([^>]*?)src\s*=\s*"([^"]*)"([^>]*?)>/gi, function(match, beforeSrc, srcValue, afterSrc) {
        return `<img${beforeSrc}src="${srcValue}" alt="${srcValue}" title="${srcValue}"${afterSrc}>`;
      });

      outputArea.value = converted;
      reader.textContent = converted.replace(/<[^>]*>?/gm, '');
      reader.focus();
    }

    function playAudio() {
      const text = document.getElementById("screenReader").textContent;
      const words = text.split(/\s+/);
      let index = 0;
      const reader = document.getElementById("screenReader");

      const interval = setInterval(() => {
        if (index >= words.length) {
          clearInterval(interval);
          return;
        }

        const highlighted = words.map((w, i) => i === index ? `<span class='highlight'>${w}</span>` : w).join(" ");
        reader.innerHTML = highlighted;
        index++;
      }, 500);

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
