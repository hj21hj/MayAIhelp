<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2025 KPF 통합 뉴스 모니터링 (전수 수집형)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --naver: #03cf5d; --google: #4285f4; --primary: #004085; --bg: #f4f7fa; }
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background: var(--bg); }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        
        /* 쿼리 설정 영역 */
        .query-settings { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e9ecef; }
        .query-label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        .query-input-group { display: flex; gap: 10px; }
        .query-input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .query-hint { font-size: 12px; color: #666; margin-top: 8px; }

        .chart-container { height: 300px; margin-bottom: 30px; padding: 15px; border: 1px solid #eee; border-radius: 10px; }
        .month-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 5px; font-size: 13px; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }
        
        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: var(--primary); }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; margin-right: 8px; }
        .badge-n { background-color: var(--naver); }
        .badge-g { background-color: var(--google); }
        .table-wrap { max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; font-size: 13px; }
        th { background: #f8f9fa; position: sticky; top: 0; z-index: 10; }
        .btn-run { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: opacity 0.3s; }
        .btn-run:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color:var(--primary);">📰 2025 통합 보도 실적 전수 수집</h2>
        <button id="csvBtn" style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;" disabled>📥 엑셀 저장</button>
    </div>

    <div class="query-settings">
        <label class="query-label">🔍 수집 키워드 설정</label>
        <div class="query-input-group">
            <input type="text" id="queryInput" class="query-input" value="언론진흥재단 | 언론재단 | KPF" placeholder="검색어를 입력하세요 (예: 언론진흥재단 | 언론재단, 수용자)">
            <button id="runBtn" class="btn-run" style="width: auto; padding: 0 40px;">수집 시작</button>
        </div>
        <p class="query-hint">※ 여러 단어 검색 시 <code>|</code> (버티컬 바)를 사용하세요. (예: 단어A | 단어B)</p>
    </div>

    <div class="chart-container">
        <canvas id="trendChart"></canvas>
    </div>

    <div id="status" style="text-align: center; margin-bottom: 15px; font-weight: bold; color: var(--primary);"></div>
    
    <div class="month-tabs" id="monthTabs"></div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder=" 결과 내 재검색 (제목 또는 언론사명)" disabled>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th style="width: 70px;">출처</th>
                    <th style="width: 100px;">날짜</th>
                    <th style="width: 150px;">언론사</th>
                    <th>기사 제목</th>
                    <th style="width: 60px; text-align: center;">링크</th>
                </tr>
            </thead>
            <tbody id="newsBody">
                <tr><td colspan="5" style="text-align:center; padding:50px; color:#999;">상단의 수집 시작 버튼을 클릭하세요.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const NAVER_ID = 'psW8xkUHR2KH4qPK9eBH'; 
    const NAVER_SECRET = '_8eXzLfqva';
    const PROXY = "https://corsproxy.io/?";

    let allNews = [];
    let currentMonth = 1;
    let trendChart;

    // 월별 탭 초기화
    for(let i=1; i<=12; i++) {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i===1 ? ' active' : '');
        btn.innerText = `${i}월`;
        btn.onclick = () => {
            currentMonth = i;
            document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx + 1 === i));
            renderTable();
        };
        document.getElementById('monthTabs').appendChild(btn);
    }

    document.getElementById('searchInput').onkeyup = () => renderTable();

    async function fetchNaverFull(targetQuery) {
        let results = [];
        for (let start = 1; start <= 1000; start += 100) {
            const url = `https://openapi.naver.com/v1/search/news.json?query=${encodeURIComponent(targetQuery)}&display=100&sort=date&start=${start}`;
            try {
                const res = await fetch(PROXY + encodeURIComponent(url), {
                    headers: { 'X-Naver-Client-Id': NAVER_ID, 'X-Naver-Client-Secret': NAVER_SECRET }
                });
                const data = await res.json();
                if (!data.items || data.items.length === 0) break;

                const processed = data.items.filter(item => {
                    const d = new Date(item.pubDate);
                    return d.getFullYear() === 2025;
                }).map(item => ({
                    src: 'Naver',
                    date: new Date(item.pubDate).toISOString().split('T')[0],
                    press: "네이버뉴스",
                    title: item.title.replace(/<[^>]*>?/gm, ''),
                    link: item.originallink || item.link,
                    month: new Date(item.pubDate).getMonth() + 1
                }));
                results = results.concat(processed);
                if (new Date(data.items[data.items.length - 1].pubDate).getFullYear() < 2025) break;
            } catch (e) { break; }
        }
        return results;
    }

    async function fetchGoogleMonth(m, targetQuery) {
        const start = `2025-${String(m).padStart(2, '0')}-01`;
        const end = `2025-${String(m).padStart(2, '0')}-${new Date(2025, m, 0).getDate()}`;
        const q = `(${targetQuery.replace(/ \| /g, ' OR ')}) after:${start} before:${end}`;
        const url = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=ko&gl=KR&ceid=KR:ko`;
        try {
            const res = await fetch(PROXY + encodeURIComponent(url));
            const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
            return Array.from(xml.querySelectorAll("item")).map(item => ({
                src: 'Google',
                date: new Date(item.querySelector("pubDate").textContent).toISOString().split('T')[0],
                press: item.querySelector("source")?.textContent || "구글뉴스",
                title: item.querySelector("title").textContent,
                link: item.querySelector("link").textContent,
                month: m
            }));
        } catch (e) { return []; }
    }

    document.getElementById('runBtn').onclick = async () => {
        const queryValue = document.getElementById('queryInput').value.trim();
        if(!queryValue) return alert("검색어를 입력해주세요.");

        const btn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        const queryInput = document.getElementById('queryInput');
        
        btn.disabled = true;
        queryInput.disabled = true;
        allNews = [];

        status.innerText = `⏳ [${queryValue}] 키워드로 네이버 분석 중...`;
        const naverData = await fetchNaverFull(queryValue);
        allNews = allNews.concat(naverData);
        updateChart(); renderTable();

        for(let m=1; m<=12; m++) {
            status.innerText = `⏳ [${queryValue}] 키워드로 구글 ${m}월 분석 중...`;
            const gData = await fetchGoogleMonth(m, queryValue);
            allNews = allNews.concat(gData);
            allNews = Array.from(new Map(allNews.map(n => [n.title, n])).values());
            updateChart();
            renderTable();
        }

        status.innerText = `✅ 완료: [${queryValue}] 총 ${allNews.length}건 수집됨`;
        document.getElementById('csvBtn').disabled = false;
        searchInput.disabled = false;
        btn.innerText = "🔄 다시 수집하기";
        btn.disabled = false;
        queryInput.disabled = false;
    };

    function renderTable() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allNews.filter(n => {
            return n.month === currentMonth && 
                   (n.title.toLowerCase().includes(searchTerm) || n.press.toLowerCase().includes(searchTerm));
        }).sort((a,b) => b.date.localeCompare(a.date));

        const tbody = document.getElementById('newsBody');
        tbody.innerHTML = filtered.map(n => `
            <tr>
                <td><span class="badge ${n.src === 'Naver' ? 'badge-n' : 'badge-g'}">${n.src === 'Naver' ? 'N' : 'G'}</span></td>
                <td>${n.date}</td>
                <td><b>${n.press}</b></td>
                <td>${n.title}</td>
                <td style="text-align:center;"><a href="${n.link}" target="_blank">🔗</a></td>
            </tr>
        `).join('') || `<tr><td colspan="5" style="text-align:center; padding:30px;">검색 결과가 없습니다.</td></tr>`;
    }

    function updateChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        const labels = Array.from({length: 12}, (_, i) => `${i+1}월`);
        const nCounts = labels.map((_, i) => allNews.filter(n => n.month === i+1 && n.src === 'Naver').length);
        const gCounts = labels.map((_, i) => allNews.filter(n => n.month === i+1 && n.src === 'Google').length);

        if(trendChart) trendChart.destroy();
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '네이버', data: nCounts, borderColor: '#03cf5d', backgroundColor: '#03cf5d22', fill: true, tension: 0.3 },
                    { label: '구글', data: gCounts, borderColor: '#4285f4', backgroundColor: '#4285f422', fill: true, tension: 0.3 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });
    }

    document.getElementById('csvBtn').onclick = () => {
        const queryValue = document.getElementById('queryInput').value.trim();
        let csv = "\uFEFF출처,날짜,언론사,제목,링크\n";
        allNews.forEach(n => {
            csv += `${n.src},${n.date},"${n.press}","${n.title.replace(/"/g,'""')}","${n.link}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `2025_보도실적_${queryValue}.csv`; a.click();
    };
</script>
</body>
</html>
