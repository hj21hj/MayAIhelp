<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2025 KPF 통합 뉴스 모니터링 (전수 수집형)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --naver: #03cf5d; --google: #4285f4; --primary: #004085; }
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background: #f4f7fa; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .chart-container { height: 300px; margin-bottom: 30px; padding: 15px; border: 1px solid #eee; border-radius: 10px; }
        .month-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 5px; font-size: 13px; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }
        /* 검색창 스타일 추가 */
        .search-box { margin-bottom: 15px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .search-box input:focus { border-color: var(--primary); }
        
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; margin-right: 8px; }
        .badge-n { background-color: var(--naver); }
        .badge-g { background-color: var(--google); }
        .table-wrap { max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; font-size: 13px; }
        th { background: #f8f9fa; position: sticky; top: 0; z-index: 10; }
        .btn-run { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color:var(--primary);">📰 2025 KPF 통합 보도 실적 (전수 수집)</h2>
        <button id="csvBtn" style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;" disabled>📥 엑셀 저장</button>
    </div>

    <div class="chart-container">
        <canvas id="trendChart"></canvas>
    </div>

    <div id="status" style="text-align: center; margin-bottom: 15px; font-weight: bold; color: var(--primary);"></div>
    
    <div class="month-tabs" id="monthTabs"></div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder=" 결과 내 검색 (제목 또는 언론사명을 입력하세요)" disabled>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th style="width: 70px;">출처</th>
                    <th style="width: 100px;">날짜</th>
                    <th style="width: 150px;">언론사</th>
                    <th>기사 제목</th>
                    <th style="width: 60px; text-align: center;">링크</th>
                </tr>
            </thead>
            <tbody id="newsBody">
                <tr><td colspan="5" style="text-align:center; padding:50px; color:#999;">수집 버튼을 누르면 1월~12월 데이터를 모두 가져옵니다.</td></tr>
            </tbody>
        </table>
    </div>

    <div style="margin-top: 20px;">
        <button id="runBtn" class="btn-run">🚀 2025년 데이터 전수 수집 및 분석 시작</button>
    </div>
</div>

<script>
    const NAVER_ID = 'psW8xkUHR2KH4qPK9eBH'; 
    const NAVER_SECRET = '_8eXzLfqva';
    const PROXY = "https://corsproxy.io/?";
    const QUERY = "언론진흥재단 | 언론재단 | KPF"; 

    let allNews = [];
    let currentMonth = 1;
    let trendChart;

    // 월별 탭 초기화
    for(let i=1; i<=12; i++) {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i===1 ? ' active' : '');
        btn.innerText = `${i}월`;
        btn.onclick = () => {
            currentMonth = i;
            document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx + 1 === i));
            renderTable();
        };
        document.getElementById('monthTabs').appendChild(btn);
    }

    // 검색창 입력 이벤트
    document.getElementById('searchInput').onkeyup = function() {
        renderTable();
    };

    async function fetchNaverFull() {
        let results = [];
        for (let start = 1; start <= 1000; start += 100) {
            const url = `https://openapi.naver.com/v1/search/news.json?query=${encodeURIComponent(QUERY)}&display=100&sort=date&start=${start}`;
            try {
                const res = await fetch(PROXY + encodeURIComponent(url), {
                    headers: { 'X-Naver-Client-Id': NAVER_ID, 'X-Naver-Client-Secret': NAVER_SECRET }
                });
                const data = await res.json();
                if (!data.items || data.items.length === 0) break;

                const processed = data.items.filter(item => {
                    const d = new Date(item.pubDate);
                    return d.getFullYear() === 2025;
                }).map(item => ({
                    src: 'Naver',
                    date: new Date(item.pubDate).toISOString().split('T')[0],
                    press: "네이버뉴스",
                    title: item.title.replace(/<[^>]*>?/gm, ''),
                    link: item.originallink || item.link,
                    month: new Date(item.pubDate).getMonth() + 1
                }));
                results = results.concat(processed);
                const lastDate = new Date(data.items[data.items.length - 1].pubDate);
                if (lastDate.getFullYear() < 2025) break;
            } catch (e) { break; }
        }
        return results;
    }

    async function fetchGoogleMonth(m) {
        const start = `2025-${String(m).padStart(2, '0')}-01`;
        const end = `2025-${String(m).padStart(2, '0')}-${new Date(2025, m, 0).getDate()}`;
        const q = `(${QUERY.replace(/ \| /g, ' OR ')}) after:${start} before:${end}`;
        const url = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=ko&gl=KR&ceid=KR:ko`;
        try {
            const res = await fetch(PROXY + encodeURIComponent(url));
            const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
            return Array.from(xml.querySelectorAll("item")).map(item => ({
                src: 'Google',
                date: new Date(item.querySelector("pubDate").textContent).toISOString().split('T')[0],
                press: item.querySelector("source")?.textContent || "구글뉴스",
                title: item.querySelector("title").textContent,
                link: item.querySelector("link").textContent,
                month: m
            }));
        } catch (e) { return []; }
    }

    document.getElementById('runBtn').onclick = async () => {
        const btn = document.getElementById('runBtn');
        const status = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        btn.disabled = true;
        allNews = [];

        status.innerText = `⏳ 네이버 데이터 전수 분석 중...`;
        const naverData = await fetchNaverFull();
        allNews = allNews.concat(naverData);
        updateChart(); renderTable();

        for(let m=1; m<=12; m++) {
            status.innerText = `⏳ 구글 뉴스 ${m}월 분석 중...`;
            const gData = await fetchGoogleMonth(m);
            allNews = allNews.concat(gData);
            allNews = Array.from(new Map(allNews.map(n => [n.title, n])).values());
            updateChart();
            renderTable();
        }

        status.innerText = `✅ 수집 완료: 총 ${allNews.length}건 (네이버 ${allNews.filter(n=>n.src==='Naver').length}건 / 구글 ${allNews.filter(n=>n.src==='Google').length}건)`;
        document.getElementById('csvBtn').disabled = false;
        searchInput.disabled = false; // 수집 완료 후 검색창 활성화
        btn.style.display = 'none';
    };

    function renderTable() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        // 월별 필터링 + 검색어 필터링 통합
        const filtered = allNews.filter(n => {
            const isMonth = n.month === currentMonth;
            const matchesSearch = n.title.toLowerCase().includes(searchTerm) || 
                                  n.press.toLowerCase().includes(searchTerm);
            return isMonth && matchesSearch;
        }).sort((a,b) => b.date.localeCompare(a.date));

        const tbody = document.getElementById('newsBody');
        tbody.innerHTML = filtered.map(n => `
            <tr>
                <td><span class="badge ${n.src === 'Naver' ? 'badge-n' : 'badge-g'}">${n.src === 'Naver' ? 'N' : 'G'}</span></td>
                <td>${n.date}</td>
                <td><b>${n.press}</b></td>
                <td>${n.title}</td>
                <td style="text-align:center;"><a href="${n.link}" target="_blank">🔗</a></td>
            </tr>
        `).join('') || `<tr><td colspan="5" style="text-align:center; padding:30px;">검색 결과가 없습니다.</td></tr>`;
    }

    function updateChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        const labels = Array.from({length: 12}, (_, i) => `${i+1}월`);
        const nCounts = labels.map((_, i) => allNews.filter(n => n.month === i+1 && n.src === 'Naver').length);
        const gCounts = labels.map((_, i) => allNews.filter(n => n.month === i+1 && n.src === 'Google').length);

        if(trendChart) trendChart.destroy();
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '네이버 (Naver)', data: nCounts, borderColor: '#03cf5d', backgroundColor: '#03cf5d22', fill: true, tension: 0.3 },
                    { label: '구글 (Google)', data: gCounts, borderColor: '#4285f4', backgroundColor: '#4285f422', fill: true, tension: 0.3 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    document.getElementById('csvBtn').onclick = () => {
        let csv = "\uFEFF출처,날짜,언론사,제목,링크\n";
        allNews.forEach(n => {
            csv += `${n.src},${n.date},"${n.press}","${n.title.replace(/"/g,'""')}","${n.link}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `2025_통합보도실적_KPF_전수조사.csv`; a.click();
    };
</script>
</body>

</html>
