<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2025 뉴스 모니터링 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --naver: #03cf5d; --google: #4285f4; --primary: #004085; }
        body { font-family: 'Pretendard', sans-serif; padding: 20px; background: #f4f7fa; line-height: 1.6; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
        .config-section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        #queryInput { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
        .chart-container { height: 300px; margin-bottom: 30px; }
        .month-tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 5px; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; font-weight: bold; }
        #filterInput { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        .table-wrap { max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; font-size: 13px; }
        th { background: #f8f9fa; position: sticky; top: 0; }
        .badge { padding: 2px 6px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; }
        .badge-n { background: var(--naver); }
        .badge-g { background: var(--google); }
        .btn-run { background: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color:var(--primary);">📰 2025 통합 뉴스 모니터링</h2>
        <button id="csvBtn" style="background:#28a745; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;" disabled>📥 엑셀 저장</button>
    </div>

    <div class="config-section">
        <strong>1단계: 수집 키워드 설정</strong>
        <div class="input-group">
            <input type="text" id="queryInput" placeholder="검색어를 입력하세요 (예: 언론진흥재단 법률지원)">
            <button id="runBtn" class="btn-run">🚀 수집 시작</button>
        </div>
    </div>

    <div class="chart-container"><canvas id="trendChart"></canvas></div>
    <div id="status" style="text-align: center; margin-bottom: 15px; font-weight: bold; color: var(--primary);">키워드를 입력하고 버튼을 눌러주세요.</div>
    
    <div class="month-tabs" id="monthTabs"></div>

    <div class="filter-box">
        <input type="text" id="filterInput" placeholder="🔎 2단계: 결과 내에서 재검색 (언론사, 제목 키워드 등)" disabled>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th style="width: 70px;">출처</th>
                    <th style="width: 100px;">날짜</th>
                    <th style="width: 120px;">언론사</th>
                    <th>기사 제목</th>
                    <th style="width: 50px;">링크</th>
                </tr>
            </thead>
            <tbody id="newsBody">
                <tr><td colspan="5" style="text-align:center; padding:50px; color:#999;">데이터가 없습니다.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const NAVER_ID = 'psW8xkUHR2KH4qPK9eBH'; 
    const NAVER_SECRET = '_8eXzLfqva';
    const PROXY = "https://corsproxy.io/?";

    let allNews = [];
    let currentMonth = 1;
    let trendChart;

    for(let i=1; i<=12; i++) {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i===1 ? ' active' : '');
        btn.innerText = `${i}월`;
        btn.onclick = () => {
            currentMonth = i;
            document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx + 1 === i));
            renderTable();
        };
        document.getElementById('monthTabs').appendChild(btn);
    }

    document.getElementById('filterInput').onkeyup = () => renderTable();

    async function fetchNaverFull(query) {
        let results = [];
        for (let start = 1; start <= 1000; start += 100) {
            const url = `https://openapi.naver.com/v1/search/news.json?query=${encodeURIComponent(query)}&display=100&sort=date&start=${start}`;
            try {
                const res = await fetch(PROXY + encodeURIComponent(url), {
                    headers: { 'X-Naver-Client-Id': NAVER_ID, 'X-Naver-Client-Secret': NAVER_SECRET }
                });
                const data = await res.json();
                if (!data.items || data.items.length === 0) break;
                const processed = data.items.filter(item => new Date(item.pubDate).getFullYear() === 2025)
                    .map(item => ({
                        src: 'Naver', date: new Date(item.pubDate).toISOString().split('T')[0],
                        press: "네이버뉴스", title: item.title.replace(/<[^>]*>?/gm, ''),
                        link: item.originallink || item.link, month: new Date(item.pubDate).getMonth() + 1
                    }));
                results = results.concat(processed);
                if (new Date(data.items[data.items.length - 1].pubDate).getFullYear() < 2025) break;
            } catch (e) { break; }
        }
        return results;
    }

    async function fetchGoogleMonth(query, m) {
        const start = `2025-${String(m).padStart(2, '0')}-01`;
        const end = `2025-${String(m).padStart(2, '0')}-${new Date(2025, m, 0).getDate()}`;
        const q = `(${query.split(' ').join(' OR ')}) after:${start} before:${end}`;
        const url = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=ko&gl=KR&ceid=KR:ko`;
        try {
            const res = await fetch(PROXY + encodeURIComponent(url));
            const xml = new DOMParser().parseFromString(await res.text(), "text/xml");
            return Array.from(xml.querySelectorAll("item")).map(item => ({
                src: 'Google', date: new Date(item.querySelector("pubDate").textContent).toISOString().split('T')[0],
                press: item.querySelector("source")?.textContent || "구글뉴스",
                title: item.querySelector("title").textContent,
                link: item.querySelector("link").textContent, month: m
            }));
        } catch (e) { return []; }
    }

    document.getElementById('runBtn').onclick = async () => {
        const query = document.getElementById('queryInput').value.trim();
        if(!query) return alert("키워드를 입력하세요.");
        
        allNews = [];
        document.getElementById('status').innerText = `⏳ 분석 시작...`;
        
        const naverData = await fetchNaverFull(query);
        allNews = allNews.concat(naverData);
        updateChart(); renderTable();

        for(let m=1; m<=12; m++) {
            document.getElementById('status').innerText = `⏳ ${m}월 통합 분석 진행 중...`;
            const gData = await fetchGoogleMonth(query, m);
            allNews = allNews.concat(gData);
            allNews = Array.from(new Map(allNews.map(n => [n.title + n.date, n])).values());
            updateChart(); renderTable();
        }

        document.getElementById('status').innerText = `✅ 수집 완료: 총 ${allNews.length}건`;
        document.getElementById('csvBtn').disabled = false;
        document.getElementById('filterInput').disabled = false;
    };

    function renderTable() {
        const filterTerm = document.getElementById('filterInput').value.toLowerCase();
        const filtered = allNews.filter(n => n.month === currentMonth && 
            (n.title.toLowerCase().includes(filterTerm) || n.press.toLowerCase().includes(filterTerm)))
            .sort((a,b) => b.date.localeCompare(a.date));

        document.getElementById('newsBody').innerHTML = filtered.map(n => `
            <tr>
                <td><span class="badge ${n.src === 'Naver' ? 'badge-n' : 'badge-g'}">${n.src === 'Naver' ? 'N' : 'G'}</span></td>
                <td>${n.date}</td>
                <td><b>${n.press}</b></td>
                <td>${n.title}</td>
                <td style="text-align:center;"><a href="${n.link}" target="_blank">🔗</a></td>
            </tr>
        `).join('') || `<tr><td colspan="5" style="text-align:center; padding:30px;">결과가 없습니다.</td></tr>`;
    }

    function updateChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        const labels = Array.from({length: 12}, (_, i) => `${i+1}월`);
        const nData = labels.map((_, i) => allNews.filter(n => n.month === i+1 && n.src === 'Naver').length);
        const gData = labels.map((_, i) => allNews.filter(n => n.month === i+1 && n.src === 'Google').length);

        if(trendChart) trendChart.destroy();
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '네이버', data: nData, borderColor: '#03cf5d', fill: false },
                    { label: '구글', data: gData, borderColor: '#4285f4', fill: false }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    document.getElementById('csvBtn').onclick = () => {
        let csv = "\uFEFF출처,날짜,언론사,제목,링크\n";
        allNews.forEach(n => csv += `${n.src},${n.date},"${n.press}","${n.title.replace(/"/g,'""')}","${n.link}"\n`);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `2025_뉴스수집.csv`; a.click();
    };
</script>
</body>
</html>
