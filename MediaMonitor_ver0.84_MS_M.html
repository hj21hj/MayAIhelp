<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPF 통합 모니터링 v0.85 (GAS 통합)</title>
    <style>
        :root { --primary: #004085; --naver: #03cf5d; --yt: #ff0000; --bg: #f4f7fa; --tab-bg: #ffffff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }

        .dashboard-grid { 
            display: grid; 
            grid-template-columns: 320px 1fr 1fr 380px; 
            gap: 12px; 
            height: 100vh; 
            padding: 15px;
        }

        .column { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
        .card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; height: 100%; min-height: 0; }
        .title { font-size: 1.05rem; font-weight: bold; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        .local-search { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.9rem; background: #fafafa; }
        .scroll-area { flex-grow: 1; overflow-y: auto; padding-right: 4px; }
        .date-filter { display: flex; gap: 5px; margin-bottom: 12px; align-items: center; }
        .date-filter input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.8rem; }

        .filter-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; overflow-y: auto; }
        .filter-btn { padding: 10px; border: 1px solid #ddd; background: #fff; border-radius: 6px; font-size: 0.85rem; text-align: left; cursor: pointer; }
        .filter-btn.active { background: var(--primary); color: #fff; font-weight: bold; }

        .item { padding: 15px 0; border-bottom: 1px solid #f1f1f1; text-decoration: none; color: inherit; display: block; }
        .item-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
        .item-info { font-size: 0.8rem; color: #888; display: flex; justify-content: space-between; }
        .press-badge { color: var(--naver); font-weight: bold; margin-right: 5px; background: #f0fff4; padding: 2px 5px; border-radius: 3px; }
        
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 12px 0; flex-shrink: 0; border-top: 1px solid #eee; }
        .btn-page { padding: 8px 12px; border: 1px solid #ddd; background: #fff; font-size: 0.85rem; cursor: pointer; border-radius: 6px; }
        .mobile-nav { display: none; }

        @media (max-width: 1024px) {
            body { padding-bottom: 60px; }
            .dashboard-grid { display: block; padding: 0; height: calc(100vh - 60px); }
            .column { display: none; height: 100%; padding: 10px; }
            .column.active { display: flex; }
            #config-col .card { height: auto; max-height: 90vh; overflow-y: auto; }
            .filter-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: none; }
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 60px; 
                background: #fff; border-top: 1px solid #ddd; z-index: 1000;
                justify-content: space-around; align-items: center;
            }
            .nav-item { flex: 1; text-align: center; font-size: 0.75rem; color: #777; cursor: pointer; }
            .nav-item.active { color: var(--primary); font-weight: bold; }
        }
        .btn-sort { font-size: 0.75rem; padding: 4px 8px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; }
        .btn-sort.active { background: #333; color: white; }
        .yt-thumb { width: 100%; aspect-ratio: 16/9; background-size: cover; border-radius: 8px; margin-bottom: 8px; background-color: #000; }
    </style>
</head>
<body>

<div class="dashboard-grid">
    <div class="column active" id="config-col">
        <div class="card">
            <div class="title">🎯 모니터링 설정</div>
            <div class="date-filter">
                <input type="date" id="startDate">
                <span>~</span>
                <input type="date" id="endDate">
            </div>
            <div class="filter-group" id="filterGroup">
                <button class="filter-btn active" onclick="applyFilter(0)">1. 재단 전체</button>
                <button class="filter-btn" onclick="applyFilter(1)">2. 신문법</button>
                <button class="filter-btn" onclick="applyFilter(2)">3. 정부광고</button>
                <button class="filter-btn" onclick="applyFilter(3)">4. 미디어거버넌스</button>
                <button class="filter-btn" onclick="applyFilter(4)">5. 미디어리터러시</button>
                <button class="filter-btn" onclick="applyFilter(5)">6. 바우처/개혁</button>
                <button class="filter-btn" onclick="applyFilter(6)">7. 유관기관</button>
                <button class="filter-btn" onclick="applyFilter(7)">8. 주요 인물</button>
                <button class="filter-btn" onclick="applyFilter(8)">9. 공공기관</button>
                <button class="filter-btn" onclick="applyFilter(9)">10. 국회/부처</button>
                <button class="filter-btn" onclick="applyFilter(10)">11. 출입기자</button>
            </div>
            <input type="text" id="queryInput" placeholder="검색어 직접 입력" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px;">
            <button class="btn-page" style="width:100%; background:#333; color:#fff; font-weight:bold; padding:15px; border-radius:8px;" onclick="fetchAllAndGo()">조회 및 결과보기</button>
        </div>
    </div>

    <div class="column" id="naver-col">
        <div class="card">
            <div class="title" style="color:var(--naver)">
                <span>🟢 네이버</span>
                <div class="sort-tabs">
                    <button id="nSortDate" class="btn-sort active" onclick="setNaverSort('date')">최신</button>
                    <button id="nSortSim" class="btn-sort" onclick="setNaverSort('sim')">관련</button>
                </div>
            </div>
            <input type="text" class="local-search" placeholder="결과 내 검색..." onkeyup="reSearchList('naverList', this.value)">
            <div id="naverList" class="scroll-area"></div>
            <div class="pagination">
                <button class="btn-page" onclick="changeNPage(-1)">이전</button>
                <span id="nPageNum" class="page-num">1</span>
                <button class="btn-page" onclick="changeNPage(1)">다음</button>
            </div>
        </div>
    </div>

    <div class="column" id="google-col">
        <div class="card">
            <div class="title" style="color:var(--primary)">
                <span>🔵 구글</span>
                <div class="sort-tabs">
                    <button id="gSortDate" class="btn-sort active" onclick="setGoogleSort('date')">최신</button>
                    <button id="gSortSim" class="btn-sort" onclick="setGoogleSort('relevance')">관련</button>
                </div>
            </div>
            <input type="text" class="local-search" placeholder="결과 내 검색..." onkeyup="reSearchList('googleList', this.value)">
            <div id="googleList" class="scroll-area"></div>
            <div class="pagination">
                <button class="btn-page" onclick="changeGPage(-1)">이전</button>
                <span id="gPageNum" class="page-num">1</span>
                <button class="btn-page" onclick="changeGPage(1)">다음</button>
            </div>
        </div>
    </div>

    <div class="column" id="yt-col">
        <div class="card">
            <div class="title" style="color:var(--yt)">
                <span>🎬 유튜브</span>
                <div class="sort-tabs">
                    <button id="ySortDate" class="btn-sort active" onclick="setYoutubeSort('date')">최신</button>
                    <button id="ySortSim" class="btn-sort" onclick="setYoutubeSort('relevance')">관련</button>
                </div>
            </div>
            <input type="text" class="local-search" placeholder="결과 내 검색..." onkeyup="reSearchList('ytList', this.value)">
            <div id="ytList" class="scroll-area"></div>
        </div>
    </div>
</div>

<div class="mobile-nav">
    <div class="nav-item active" onclick="switchTab('config-col', 0)">⚙️<br>설정</div>
    <div class="nav-item" onclick="switchTab('naver-col', 1)">🟢<br>네이버</div>
    <div class="nav-item" onclick="switchTab('google-col', 2)">🔵<br>구글</div>
    <div class="nav-item" onclick="switchTab('yt-col', 3)">🎬<br>유튜브</div>
</div>

<script>
    // ---------------------------------------------------------
    // 사용자가 만든 GAS 프록시 주소 (반드시 본인의 주소인지 재확인)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx674hDBg15__FCk1XB2HqOuxWMNB6Y2qn7b7WATT3QMCBNb4vPQzml7uZY8MJtbalU3A/exec";
    
    // 유튜브 API 키 (유튜브 검색 시 필요)
    const GOOGLE_API_KEY = '실제_유튜브_API_키를_입력하세요'; 
    // ---------------------------------------------------------

    const foundationPrefix = "(한국언론진흥재단 | 언론진흥재단)";
    const pressQuery = `${foundationPrefix} ("사지원" | "4g1@dong" | "김정한" | "acenes@n" | "전성민" | "ball@ajun" | "김태언" | "beborn@d" | "전병남" | "bn@sbs.cc" | "이복진" | "bok@segy" | "정지용" | "cdragon25" | "채영권" | "chae091@" | "김현아" | "chaos@ed" | "서형석" | "codealpha" | "홍지현" | "cookingwr" | "최성진" | "csj@hani.c" | "문화부" | "culture@f" | "유정무" | "dbwjdan12" | "신동흔" | "dhshin@cl" | "박성동" | "dong@jou" | "어환희" | "eo.hwanhe" | "엄재희" | "eomjh24@" | "조기용" | "excuseme@" | "서민음" | "faith@asia" | "김용석" | "fineview@" | "하남현" | "ha.namhyu" | "김희경" | "hkkim@ha" | "이호재" | "hoho@do" | "김유태" | "ink@mk.co" | "신진아" | "jashin@fn" | "정진수" | "jen@segye" | "전혜원" | "jhw@asiat" | "김지예" | "jiye@seou" | "조종엽" | "jjj@donga" | "정주원" | "jnwn@mk" | "조성민" | "josungmin" | "고성욱" | "kswk95@g" | "이종길" | "leemean@e" | "이태훈" | "libra@cho" | "정혜진" | "madein@s" | "윤수현" | "melanchol" | "고미혜" | "mihye@yn" | "윤민식" | "minsikyoo" | "유승목" | "mok@mt.c" | "홍석우" | "musehong" | "박수련" | "park.suryo" | "박대의" | "pashapark" | "박대형" | "pdh9511@" | "김기윤" | "pep@don" | "정철운" | "pierce@m" | "최용식" | "press01190" | "남보라" | "rarara@ha" | "신새롬" | "romi@yna" | "유선준" | "rsunjun@f" | "김슬기" | "sblake@m" | "손의연" | "seyyes@ec" | "장병호" | "solanin@e" | "김세관" | "sone@mt." | "신상호" | "ssheyes@h" | "송석주" | "ssp@etoda" | "김석" | "stone21@l" | "강푸른" | "strongblue" | "김상운" | "sukim@do" | "최승영" | "sychoi@jo" | "전종휘" | "symbio@h" | "박강수" | "turner@ha" | "최인철" | "unodos123" | "이한빛" | "vicky@her" | "장예림" | "yeaah@as" | "노진호" | "yesno@jtb" | "김영재" | "youngjae.k")`;

    const filterKeywords = [
        "한국언론진흥재단 | 언론진흥재단 | 언론재단",
        "(한국언론진흥재단 | 언론진흥재단 | 언론재단) 신문법",
        "(한국언론진흥재단 | 언론진흥재단 | 언론재단) 정부광고",
        "(한국언론진흥재단 | 언론진흥재단 | 언론재단) 미디어거버넌스",
        "(한국언론진흥재단 | 언론진흥재단 | 언론재단) 미디어리터러시",
        "미디어바우처 | 미디어특위 | 언론진흥기금 | 지역신문발전기금 | 언론노조 | 언론정책 | 언론개혁",
        "문체위 | 세종프레스센터 | 뉴스제휴평가위원회 | 제평위 | 신문윤리위원회 | 김효재",
        "오세욱 | 박영흠 | 진민정",
        "공공기관",
        "신문 | 인터넷신문 | 방송 | 통신 | 국회 | 문화체육관광부 | 과학기술방송통신부",
        pressQuery
    ];

    const mediaMap = {'001': '연합뉴스', '005': '국민일보', '020': '동아일보', '021': '문화일보', '023': '조선일보', '025': '중앙일보', '028': '한겨레', '032': '경향신문', '081': '서울신문', '214': 'MBC', '055': 'SBS', '052': 'YTN', '056': 'KBS', '003': '내일신문', '011': '서울경제', '014': '파이낸셜뉴스', '015': '한국경제', '018': '이데일리', '009': '매일경제', '031': '아이뉴스24', '047': '오마이뉴스', '006': '미디어오늘', '119': '데일리안'};

    let nPage = 1, gPage = 1, nSort = 'date', gSort = 'date', ySort = 'date', gCachedItems = [];

    function switchTab(colId, navIdx) {
        document.querySelectorAll('.column').forEach(c => c.classList.remove('active'));
        document.getElementById(colId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach((n, i) => n.classList.toggle('active', i === navIdx));
        window.scrollTo(0,0);
    }

    function fetchAllAndGo() {
        fetchAll();
        if(window.innerWidth <= 1024) switchTab('naver-col', 1);
    }

    function reSearchList(targetId, keyword) {
        const items = document.getElementById(targetId).querySelectorAll('.item, .yt-card');
        items.forEach(item => {
            const title = item.querySelector('.item-title').innerText.toLowerCase();
            item.style.display = title.includes(keyword.toLowerCase()) ? 'block' : 'none';
        });
    }

    // 🟢 네이버 호출 (GAS 사용)
    async function fetchNaver() {
        const q = document.getElementById('queryInput').value;
        const start = ((nPage - 1) * 15) + 1;
        const api = `https://openapi.naver.com/v1/search/news.json?query=${encodeURIComponent(q)}&display=50&start=${start}&sort=${nSort}`;
        
        try {
            const res = await fetch(`${GAS_URL}?url=${encodeURIComponent(api)}`);
            const data = await res.json();
            
            const startD = document.getElementById('startDate').value ? new Date(document.getElementById('startDate').value) : null;
            const endD = document.getElementById('endDate').value ? new Date(document.getElementById('endDate').value) : null;
            if(endD) endD.setHours(23,59,59);

            const filtered = (data.items || []).filter(item => {
                if (!startD || !endD) return true;
                const pDate = new Date(item.pubDate);
                return pDate >= startD && pDate <= endD;
            });

            document.getElementById('naverList').innerHTML = filtered.map(i => {
                let press = "뉴스";
                if(i.link.includes("naver.com")) {
                    const m = i.link.match(/oid=(\d+)/);
                    if(m) press = mediaMap[m[1]] || `매체(${m[1]})`;
                }
                return `<a href="${i.link}" target="_blank" class="item"><div class="item-title">${i.title.replace(/<[^>]*>?/gm, '')}</div><div class="item-info"><span class="press-badge">${press}</span><span>${new Date(i.pubDate).toLocaleDateString()}</span></div></a>`;
            }).join('') || '<div style="padding:40px; text-align:center;">데이터 없음</div>';
            document.getElementById('nPageNum').innerText = nPage;
        } catch(e) { 
            document.getElementById('naverList').innerHTML = '네이버 데이터 호출 실패'; 
        }
    }

    // 🔵 구글 호출 (AllOrigins 대신 GAS 프록시 사용하도록 전면 수정)
    async function fetchGoogle() {
        if (gPage === 1 || gCachedItems.length === 0) {
            const q = document.getElementById('queryInput').value + (document.getElementById('startDate').value ? ` after:${document.getElementById('startDate').value}` : "");
            const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=ko&gl=KR&ceid=KR:ko`;
            
            try {
                // GAS_URL을 통해 구글 RSS 요청
                const res = await fetch(`${GAS_URL}?url=${encodeURIComponent(rssUrl)}`);
                const text = await res.text();
                
                // GAS 응답이 JSON 형식이거나 에러 텍스트일 수 있으므로 XML 파싱 전 체크
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                
                // 파싱 에러 여부 확인
                if (xml.getElementsByTagName("parsererror").length > 0) {
                    throw new Error("XML 파싱 실패");
                }

                gCachedItems = Array.from(xml.querySelectorAll("item"));
                
                if (gSort === 'date') {
                    gCachedItems.sort((a,b) => new Date(b.querySelector("pubDate").textContent) - new Date(a.querySelector("pubDate").textContent));
                }
            } catch(e) { 
                console.error("Google Fetch Error:", e);
                gCachedItems = []; 
            }
        }
        
        const paged = gCachedItems.slice((gPage-1)*15, gPage*15);
        document.getElementById('googleList').innerHTML = paged.map(n => {
            const title = n.querySelector("title")?.textContent || "제목 없음";
            const link = n.querySelector("link")?.textContent || "#";
            const source = n.querySelector("source")?.textContent || "Google News";
            const pubDate = n.querySelector("pubDate")?.textContent || "";
            return `<a href="${link}" target="_blank" class="item">
                <div class="item-title">${title}</div>
                <div class="item-info">
                    <span style="color:var(--primary); font-weight:bold;">${source}</span>
                    <span>${pubDate ? new Date(pubDate).toLocaleDateString() : ''}</span>
                </div>
            </a>`;
        }).join('') || '<div style="padding:40px; text-align:center;">결과 없음</div>';
        document.getElementById('gPageNum').innerText = gPage;
    }

    // 🎬 유튜브 호출
    async function fetchYoutube() {
        const q = document.getElementById('queryInput').value;
        const order = (ySort === 'date') ? 'date' : 'relevance';
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&maxResults=15&order=${order}&type=video&key=${GOOGLE_API_KEY}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            if(data.error) throw new Error();
            document.getElementById('ytList').innerHTML = (data.items || []).map(v => `<a href="https://www.youtube.com/watch?v=${v.id.videoId}" target="_blank" class="item"><div class="yt-thumb" style="background-image:url('${v.snippet.thumbnails.medium.url}')"></div><div class="item-title" style="font-size:0.9rem;">${v.snippet.title}</div><div class="item-info"><span>${v.snippet.channelTitle}</span></div></a>`).join('') || '결과 없음';
        } catch(e) { 
            document.getElementById('ytList').innerHTML = '<div style="padding:20px; text-align:center;">유튜브 API 키를 확인하세요.</div>'; 
        }
    }

    function applyFilter(idx) {
        document.querySelectorAll('.filter-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
        document.getElementById('queryInput').value = filterKeywords[idx];
        nPage = 1; gPage = 1; gCachedItems = [];
        fetchAll();
    }

    function updateSortUI(prefix, selected) {
        document.getElementById(prefix + 'SortDate').classList.toggle('active', selected === 'date');
        document.getElementById(prefix + 'SortSim').classList.toggle('active', (selected === 'sim' || selected === 'relevance'));
    }

    function setNaverSort(s) { nSort = s; nPage = 1; updateSortUI('n', s); fetchNaver(); }
    function setGoogleSort(s) { gSort = s; gPage = 1; gCachedItems = []; updateSortUI('g', s); fetchGoogle(); }
    function setYoutubeSort(s) { ySort = s; updateSortUI('y', s); fetchYoutube(); }
    function changeNPage(s) { nPage = Math.max(1, nPage + s); fetchNaver(); }
    function changeGPage(s) { 
        const maxPage = Math.ceil(gCachedItems.length / 15);
        gPage = Math.max(1, Math.min(maxPage || 1, gPage + s)); 
        fetchGoogle(); 
    }

    function fetchAll() { 
        document.querySelectorAll('.local-search').forEach(input => input.value = '');
        fetchNaver(); 
        fetchGoogle(); 
        fetchYoutube(); 
    }

    window.onload = function() {
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const dayOfWeek = now.getDay();
        let startDate;
        if (dayOfWeek === 1) { 
            const friday = new Date(now); friday.setDate(now.getDate() - 3);
            startDate = friday.toISOString().split('T')[0];
        } else {
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            startDate = yesterday.toISOString().split('T')[0];
        }
        document.getElementById('startDate').value = startDate;
        document.getElementById('endDate').value = todayStr;
        applyFilter(0);
    };
</script>
